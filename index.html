<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aphex</title>
  <meta property="og:title" content="Aphex">
  <meta property="og:description" content="Aphex Corporation">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23000'/><path d='M16 4 L4 28 L10 28 L16 16 L22 28 L28 28 Z' fill='%23fff'/></svg>">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 10;
    }

    .fallback-logo {
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(32px, 10vw, 120px);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #fff;
      text-transform: uppercase;
    }

    .fallback-email {
      margin-top: 2em;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(12px, 2vw, 18px);
      letter-spacing: 0.15em;
    }

    .fallback-email a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
    }

    .fallback-email a:hover {
      color: #fff;
    }

    #email-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5em;
      padding-bottom: 15vh;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-in;
      pointer-events: none;
    }

    #email-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #email-overlay a.email {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-size: clamp(12px, 1.5vw, 16px);
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      text-transform: lowercase;
    }

    #email-overlay a.email:hover {
      color: rgba(255, 255, 255, 0.8);
    }

    #email-overlay a.instagram {
      display: inline-flex;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.3s ease, transform 0.3s ease;
    }

    #email-overlay a.instagram:hover {
      color: rgba(255, 255, 255, 0.8);
      transform: scale(1.1);
    }

    #email-overlay a.instagram svg {
      width: clamp(22px, 2.4vw, 28px);
      height: clamp(22px, 2.4vw, 28px);
      display: block;
    }
  </style>
</head>
<body>
  <noscript>
    <div class="fallback">
      <div class="fallback-logo">APHEX</div>
      <div class="fallback-email">
        <a href="mailto:hello@aphex.cx">hello@aphex.cx</a>
      </div>
    </div>
  </noscript>

  <script>
    (function() {
      try {
        var canvas = document.createElement('canvas');
        var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) throw new Error('No WebGL');
      } catch (e) {
        var fallback = document.createElement('div');
        fallback.className = 'fallback';

        var logo = document.createElement('div');
        logo.className = 'fallback-logo';
        logo.textContent = 'APHEX';
        fallback.appendChild(logo);

        var emailWrap = document.createElement('div');
        emailWrap.className = 'fallback-email';

        var emailLink = document.createElement('a');
        emailLink.href = 'mailto:hello@aphex.cx';
        emailLink.textContent = 'hello@aphex.cx';
        emailWrap.appendChild(emailLink);

        fallback.appendChild(emailWrap);
        document.body.appendChild(fallback);

        window.__NO_WEBGL = true;
      }
    })();
  </script>

  <div id="email-overlay">
    <a class="email" href="mailto:hello@aphex.cx">hello@aphex.cx</a>
    <a class="instagram" href="https://instagram.com/aphexcx" target="_blank" rel="noopener noreferrer" aria-label="Instagram (@aphexcx)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
    </a>
  </div>

  <script src="dist/particles.js"></script>
</body>
</html>
